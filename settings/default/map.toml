# XIVLegacy Server: map (the game world), shipped defaults.
# Don't edit this file: put what differs in settings/map.toml (see settings/README.md).

[server]
bind_ip = "127.0.0.1"
port = 1989
show_timestamp = true
world_id = 1

[database]
# The MariaDB database every server shares. Put the password in your own
# settings file or in XIVLEGACY_DB_URL, not here.
url = "mysql://xivlegacy@127.0.0.1:3306/xivlegacy"

[scripting]
script_root = "./scripts/lua"
# Set false to skip zone/actor loaders (used by the integration test harness
# to boot against an offline DB). Leave true for a real server.
load_from_database = true

[world]
# Dalamud, the red moon, grows in each player's sky with their main story
# progress (no gameplay effect). Set dalamud_by_story = false to show
# everyone dalamud_phase instead: the client's sky stage 0-7 (4 = a small
# orange star, 5 and 6 bigger, 0 and 7 the big red moon of 1.0's last days;
# 1-3 draw nothing), or -1 to hide it. Players can preview with !mydalamud.
dalamud_by_story = true
dalamud_phase = 0
# Weather id (1 = clear) + transition time emitted at zone-in.
weather_id = 1
weather_transition = 1

# Gameplay limits. Every default is the 1.23b retail value. Each setting has a
# safe range (outside it the server warns at start-up) and a hard range (the
# server uses the nearest end instead and logs an error, since the client
# breaks past it). Table with the reasons: settings/README.md, "Gameplay limits".
[progression]
# Highest level a class reaches by earning EXP. Retail 50; 1-50 (the client's
# EXP bar and the level tables end at 50). Characters already above a lowered
# cap keep their level and earn no EXP toward the next.
level_cap = 50
# EXP multiplier, percent, for every class but the crafters and gatherers:
# kills, quests, leves, GM !giveexp, after rested/food bonuses. Retail 100;
# safe 0-1000, hard 0-10000.
exp_rate_percent = 100
# The same for the crafters (carpenter..culinarian) and gatherers (miner,
# botanist, fisher). Retail 100; safe 0-1000, hard 0-10000.
crafting_gathering_exp_rate_percent = 100

[storage]
# Normal-bag slots that take new items. Retail 200; safe 50-200, hard 1-200
# (the client crashes at every login with an item at slot 200 or above, so it
# can only be lowered). Items already past a lowered size stay; new ones that
# don't fit are refused.
bag_slots = 200

[economy]
# NPC shop prices in gil, percent (seal and guild-mark shops don't change).
# The shop window still shows the retail price; the charge and the purchase
# message use this one. Never below what an NPC pays back for the item.
# NPCs buy items back at retail prices. Retail 100; safe 50-300, hard 0-1000.
shop_price_percent = 100
# Chocobo gil costs (the rental fee, retail 800 gil), percent. Retail 100;
# safe 0-500, hard 0-10000.
chocobo_price_percent = 100
# Gil from monsters, leves and treasure chests, percent (quest rewards and
# sales to NPCs don't change). Retail 100; safe 0-1000, hard 0-10000.
gil_drop_percent = 100

[drops]
# The chance of each monster item drop, percent; a chance never goes past
# 100%. Retail 100; safe 0-500, hard 0-10000.
drop_rate_percent = 100
# On top of that for rare drops, and the chance a dropped item is HQ, so good
# items get likelier without flooding common materials. Retail 100; safe
# 0-500, hard 0-10000.
rare_drop_percent = 100
