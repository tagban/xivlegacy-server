# XIVLegacy Server: who may use each chat command (typed in game as !command),
# shipped defaults. Don't edit this file: put what you change in
# settings/commands.toml (only what differs; see settings/README.md).
#
# GM levels, set per account with !setgm <level> <character name> (or from
# the map server's console):
#   0 player   1 helper   2 GM   3 senior GM   4 administrator
#
# A command not listed here needs administrator. Commands that aren't retail
# behavior (free teleports, for example) default to GM; lower one to 0 to give
# it to every player on your server.

# The level needed to aim a command at someone else; below it, a command only
# works on whoever typed it.
target_others = 2

[levels]
# everyone
help = 0
who = 0
mp = 0
version = 0
# the bugreport module's !bug (modules/bugreport)
bug = 0
# every command you may use, with how to type it
gmhelp = 0
# on yourself only (below target_others), and nothing that helps you or
# reaches anyone else: where you are; music or a sky only you hear and see
# (!setmusic stays until !setmusic off or logout, !myweather and
# !mydalamud until you zone); clearing a stuck mount or bed/dream state
pos = 0
setmusic = 0
myweather = 0
mydalamud = 0
dismount = 0
wake = 0
# getting around, on yourself only: !home (back to your home point, the
# same as Return), !zone to a city, an open field or an open-world dungeon
# (GM-only, duty, raid and test zones stay closed to players), and !posfix
# for a character of your own account who can't log in where they stand
home = 0
zone = 0
posfix = 0

# GMs: moving players around, looking after them
endevent = 2
camp = 2
warp = 2
# entering a 1.0 dungeon in your own copy, until its queue NPCs are scripted
dungeon = 2
# playing any of the client's cutscenes where you stand (client/cut/<name>)
cutscene = 2
gmcottage = 2
revive = 2
speed = 2
goto = 2
side = 2
bring = 2
send = 2
return = 2
up = 2
down = 2
getid = 2
# saving a monster's or NPC's spot to the world database
setpos = 3
hasitem = 2
haskeyitem = 2
# looking up item ids by name
finditem = 2
togglegm = 2
gmgear = 2
jail = 2
pardon = 2
setweather = 2
# seasonal events (settings/events.toml): show, or switch on/off/auto
event = 2
# run one seasonal event and stop the others
starlight = 2
moonfire = 2
halloween = 2
allsaints = 2
easter = 2
hatchingtide = 2
# the Atomos camps (event `atomos`): show, or open/close one now
atomos = 2

# senior GMs: changing what characters have, and what reaches everyone
bringall = 3
logoff = 3
announce = 3
additem = 3
delitem = 3
addkeyitem = 3
delkeyitem = 3
setgil = 3
takegil = 3
addquest = 3
completequest = 3
delquest = 3
addtitle = 3
addeffect = 3
addallaetherytes = 3
givegil = 3
giveexp = 3
sethome = 3
joingc = 3
setgcrank = 3
addgcseals = 3
accruerest = 3
issuechocobo = 3
rentchocobo = 3
hireretainer = 3
dismissretainer = 3
listretainers = 3
setsleeping = 3
dream = 3
spawn = 3
despawn = 3
sethp = 3
settp = 3
usemove = 3
monstermode = 3
leve = 3
factioncredit = 3
die = 3
# classes, levels, jobs and gear (a GM's test characters)
setclass = 3
setlevel = 3
maxall = 3
setjob = 3
gearset = 3
equip = 3
unequip = 3
# only while the finaldays module is enabled (modules/finaldays)
worldend = 3

# administrators: GM levels, scripts and quest debugging
setgm = 4
reload = 4
talkto = 4
pushtrigger = 4
setseq = 4
