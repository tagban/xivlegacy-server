# XIVLegacy Server: lobby (character list and world hand-off), shipped defaults.
# Don't edit this file: put what differs in settings/lobby.toml (see settings/README.md).

[server]
bind_ip = "127.0.0.1"
port = 54994
show_timestamp = true

[database]
# The MariaDB database every server shares. Put the password in your own
# settings file or in XIVLEGACY_DB_URL, not here.
url = "mysql://xivlegacy@127.0.0.1:3306/xivlegacy"
