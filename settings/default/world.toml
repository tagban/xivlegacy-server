# XIVLegacy Server: world, shipped defaults.
# Don't edit this file: put what differs in settings/world.toml (see settings/README.md).

[server]
bind_ip = "127.0.0.1"
port = 54992
show_timestamp = true
# Entry id in the server list (settings: servers.toml) — it ships with
# id=1 "Fernehalwes" so this matches out of the box.
world_id = 1

[database]
# The MariaDB database every server shares. Put the password in your own
# settings file or in XIVLEGACY_DB_URL, not here.
url = "mysql://xivlegacy@127.0.0.1:3306/xivlegacy"
